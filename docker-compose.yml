services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: studyon
      POSTGRES_PASSWORD: studyon
      POSTGRES_DB: studyon
    ports:
      - "5432:5432"
    volumes:
      - studyon_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  studyon_postgres_data:
